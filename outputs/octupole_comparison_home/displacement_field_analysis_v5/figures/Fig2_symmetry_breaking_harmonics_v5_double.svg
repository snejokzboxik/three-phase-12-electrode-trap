<text x="89" y="101" text-anchor="middle" dominant-baseline="middle" font-size="5.8pt" font-weight="normal" fill="#5D6872">
<tspan x="89" dy="0">In the local harmonic expansion, Φ₁ ∝ r gives an approximately constant dipolar field; Φ₄ ∝ r⁴ gives E₄ ∝ r³.</tspan>
</text>
<text x="89" y="107" text-anchor="middle" dominant-baseline="middle" font-size="5.8pt" font-weight="normal" fill="#5D6872">
<tspan x="89" dy="0">At r = 0.5, 1 and 2 mm, the m = 1 to m = 4 electric-field amplitude ratio is about 1.44×10³, 1.80×10² and 22.5.</tspan>
