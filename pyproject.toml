[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-phase-12-electrode-trap"
version = "0.1.0"
description = "Independent FEM and particle-dynamics study of a three-phase 12-electrode trap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "scikit-fem>=10.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gmsh = ["gmsh>=4.13", "meshio>=5.3"]

[project.scripts]
three-phase-trap = "three_phase_trap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

